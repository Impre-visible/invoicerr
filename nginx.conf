server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:3000/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SECURITY_AUDIT.md finding #1: OVERWRITE with $remote_addr (nginx's own view of the
        # client), never $proxy_add_x_forwarded_for — that directive APPENDS to any
        # X-Forwarded-For the client already sent, so a client could prefix a fake IP and have
        # it read as the "real" one downstream (better-auth's rate limiter, and Express's
        # req.ip once `trust proxy` is set in backend/src/main.ts, both take the FIRST value).
        # nginx is the only hop in front of this backend (same container, see entrypoint.sh), so
        # $remote_addr here is always the actual client IP, never spoofable.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_set_header X-Accel-Buffering no;
    }
}